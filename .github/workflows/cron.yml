name: cron-tick

# Free scheduler for the outbox sweeps (dispatch / 24h reminder / day-5 close).
# GitHub Actions cron can be delayed or skipped under load — fine here because
# every sweep is idempotent and time-based (a late tick just catches up).
# Scheduled workflows also pause after 60 days of repo inactivity.
#
# ONE-TIME SETUP: add a repo secret CRON_SWEEP_SECRET
#   (GitHub -> Settings -> Secrets and variables -> Actions -> New repository
#    secret) with the same value as CRON_SWEEP_SECRET in web/.env.local.
# If you move to a custom domain, update TICK_URL below.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/tick
        env:
          TICK_URL: https://bezoek.krofs.nl/api/tick
          CRON_SECRET: ${{ secrets.CRON_SWEEP_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::repo secret CRON_SWEEP_SECRET ontbreekt — voeg 'm toe onder Settings -> Secrets -> Actions"
            exit 1
          fi
          # Een enkele mislukte tick is onschadelijk: elke sweep is idempotent en
          # tijdgebaseerd, dus de volgende tick (of een retry) loopt vanzelf bij.
          # Daarom 3 pogingen met pauze; pas als ALLE pogingen falen slaan we
          # alarm. Dat voorkomt een vals "All jobs failed"-mailtje bij een korte
          # hik (Vercel cold start / Supabase Free-tier blip) en houdt de mail
          # over voor een echte, aanhoudende storing.
          attempts=3
          code=000
          for i in $(seq 1 "$attempts"); do
            code=$(curl -s -o /tmp/tick.json -w '%{http_code}' --max-time 60 \
              -X POST "$TICK_URL" -H "x-cron-secret: $CRON_SECRET")
            echo "poging $i/$attempts -> HTTP $code"
            cat /tmp/tick.json 2>/dev/null || true
            echo ""
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "geen 200 — 15s wachten en opnieuw proberen..."
              sleep 15
            fi
          done
          echo "::error::tick faalde na $attempts pogingen (laatste HTTP $code) — waarschijnlijk een aanhoudende storing, controleer bezoek.krofs.nl/api/tick"
          exit 1
